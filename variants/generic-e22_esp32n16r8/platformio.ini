[Generic_E22_S3n16r8]
extends = esp32_base
board = esp32-s3-devkitc-1-n16r8v
build_flags =
  ${esp32_base.build_flags}
  -I variants/generic-e22_esp32n16r8  

  -D P_LORA_NSS=4
  -D P_LORA_RESET=5
  -D P_LORA_BUSY=6
  -D P_LORA_DIO_1=10
  -D P_LORA_SCLK=7
  -D P_LORA_MISO=8
  -D P_LORA_MOSI=9
  -D SX126X_RXEN=13
  -D SX126X_TXEN=14
  
  ; === ОСТАЛЬНЫЕ ПИНЫ ===
  -D PIN_USER_BTN=0
  -D PIN_STATUS_LED=48
  -D PIN_BOARD_SDA=1
  -D PIN_BOARD_SCL=2
  
  ; === НАСТРОЙКИ SX1262 ===
  -D SX126X_DIO2_AS_RF_SWITCH=false
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D MAX_LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1 

build_src_filter = ${esp32_base.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<../variants/generic-e22_esp32n16r8>
lib_deps =
  ${esp32_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13

[env:Generic_esp32n16r8_E22_sx1262_repeater]
extends = Generic_E22_S3n16r8
build_src_filter = ${Generic_E22_S3n16r8.build_src_filter}
  +<../examples/simple_repeater/*.cpp>
build_flags =
  ${Generic_E22_S3n16r8.build_flags}
  -D LORA_TX_POWER=12                        
  -D ADVERT_NAME='"KRT-E22S3N16-TestRepa"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
lib_deps =
  ${Generic_E22_S3n16r8.lib_deps}
  ${esp32_ota.lib_deps}                     

[env:Generic2n1_esp36r8_E22_sx1262_companion_radio_wifi]
extends = Generic_E22_S3n16r8
build_src_filter = ${Generic_E22_S3n16r8.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/GlobalRegistry.h>
  +<helpers/ui/SSD1306Display.h>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
build_flags =
  ${Generic_E22_S3n16r8.build_flags}
  -I examples/companion_radio/ui-new
  -D LORA_TX_POWER=17
  -D HAS_SCREEN=1
  -D USE_SSD1306=1
  -D MAX_CONTACTS=400
  -D MAX_GROUP_CHANNELS=40
  -D OFFLINE_QUEUE_SIZE=256
  -D WIFI_DEBUG_LOGGING=1
  -D WIFI_SSID='"SSID Name"'
  -D WIFI_PWD='"WIFI Password"'
  -D DISPLAY_CLASS=SSD1306Display
  -D DISPLAY_ROTATION=2
lib_deps =
  ${Generic_E22_S3n16r8.lib_deps}
  ${esp32_ota.lib_deps}
  densaugeo/base64 @ ~1.4.0
  adafruit/Adafruit SSD1306 @ ^2.5.13
